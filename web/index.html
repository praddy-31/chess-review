<!doctype html>
<html lang="en" data-theme="mocha" data-board="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Review</title>
<link rel="stylesheet" href="styles.css">
</head>

<div id="app">
  <nav id="nav">

    </div>
    <a class="item" data-nav="library" href="#/library">

    <a class="item" data-nav="review" id="nav-review" href="#/review">

    <a class="item" data-nav="board" href="#/board">

  </nav>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>
<script src="board.js"></script>
<script src="app.js"></script>
<script src="library.js"></script>
<script src="review.js"></script>
<script src="settings.js"></script>
<script src="setup.js"></script>
<script src="train.js"></script>
<script src="openings.js"></script>
<script src="insights.js"></script>
<script src="play.js"></script>
<script src="main.js"></script>
</body>
</html>
